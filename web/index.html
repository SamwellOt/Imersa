<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3E%3Cdefs%3E%3CclipPath id='c'%3E%3Ccircle cx='12' cy='12' r='9.4'/%3E%3C/clipPath%3E%3C/defs%3E%3Ccircle cx='12' cy='12' r='9.4' stroke='%232fc9af' stroke-width='1.6' opacity='.4'/%3E%3Cg clip-path='url(%23c)'%3E%3Cpath d='M-2 13.6c2.5 0 2.5-2.3 5-2.3s2.5 2.3 5 2.3 2.5-2.3 5-2.3 2.5 2.3 5 2.3 2.5-2.3 5-2.3V25H-2z' fill='%232fc9af'/%3E%3C/g%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Imersa" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#12181a" />
    <meta name="description" content="Imersa — doses diárias de imersão em vídeo nativo, com flashcards minerados da própria dose." />
    <title>Imersa</title>
    <script>
      // Aplica o tema salvo ANTES da primeira pintura. Sem isso, quem usa o tema
      // claro via um flash escuro a cada carregamento (o <html> vinha fixo em dark).
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("imersa-prefs") || "{}");
          var t = (p.state && p.state.theme) === "light" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", t);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", t === "light" ? "#f4f2ec" : "#12181a");
        } catch (e) {
          /* localStorage bloqueado: segue no padrão escuro */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
